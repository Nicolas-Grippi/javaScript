<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Carrito | Escaloneta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

    <div class="container my-5">
        <h2 class="mb-4 fw-bold"><i class="bi bi-cart3 me-2"></i>Tu Carrito</h2>
        
        <div class="row">
            <div class="col-lg-8">
                <div id="listaCarrito" class="bg-white p-3 rounded shadow-sm">
                </div>
            </div>
            
            <div class="col-lg-4">
                <div class="bg-white p-4 rounded shadow-sm">
                    <h4 class="fw-bold">Resumen</h4>
                    <hr>
                    <div class="d-flex justify-content-between fs-5">
                        <span>Total:</span>
                        <span id="precioTotal" class="fw-bold text-primary">$0</span>
                    </div>
                    <button class="btn btn-success w-100 mt-4 fw-bold py-3" onclick="finalizarCompra()">Finalizar Compra</button>
                    <button class="btn btn-outline-danger btn-sm w-100 mt-2" onclick="vaciarCarrito()">Vaciar Carrito</button>
                    <a href="index.html" class="btn btn-link w-100 mt-2 text-decoration-none text-dark">Continuar comprando</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/funciones.js"></script>
    
    <script>
        // 1. FUNCIÓN PARA MOSTRAR LOS PRODUCTOS
        function recorrerCarrito() {
            const carrito = cargarCarrito();
            const contenedor = document.getElementById("listaCarrito");
            let total = 0;

            if (carrito.length === 0) {
                contenedor.innerHTML = `
                <div class="text-center p-5">
                    <i class="bi bi-cart-x fs-1 text-muted"></i>
                    <p class="mt-3">El carrito está vacío :(</p>
                </div>`;
                document.getElementById("precioTotal").innerText = "$0";
                return;
            }

            let html = "";
            carrito.forEach((item) => {
                total += item.precio;
                html += `
                <div class="d-flex align-items-center border-bottom py-3">
                    <img src="images/${item.imagen}" width="80" class="rounded me-3" onerror="this.src='./images/logoafa.png'">
                    <div class="flex-grow-1">
                        <h6 class="mb-0 fw-bold">${item.nombre}</h6>
                        <small class="text-muted">$${item.precio.toLocaleString('es-AR')}</small>
                    </div>
                    <button class="btn btn-sm btn-danger" onclick="eliminarProducto(${item.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>`;
            });

            contenedor.innerHTML = html;
            document.getElementById("precioTotal").innerText = `$${total.toLocaleString('es-AR')}`;
        }

        // 2. FUNCIÓN PARA ELIMINAR UN PRODUCTO POR ID
        function eliminarProducto(id) {
            let carrito = cargarCarrito();
            // Buscamos el índice para borrar solo uno en caso de repetidos
            const index = carrito.findIndex(item => item.id == id);
            
            if (index !== -1) {
                carrito.splice(index, 1);
                guardarCarrito(carrito);
                recorrerCarrito(); // Actualiza la lista
                if (typeof recorrerBotonCarrito === 'function') recorrerBotonCarrito(); // Actualiza el badge
            }
        }

        // 3. FUNCIÓN PARA VACIAR TODO EL CARRITO
        function vaciarCarrito() {
            localStorage.removeItem("carrito");
            recorrerCarrito();
            if (typeof recorrerBotonCarrito === 'function') recorrerBotonCarrito();
        }

        // 4. FUNCIÓN PARA FINALIZAR LA COMPRA
        function finalizarCompra() {
            const carrito = cargarCarrito();
            if(carrito.length === 0) {
                return Swal.fire("Carrito vacío", "Agrega algunos productos antes de finalizar", "error");
            }

            Swal.fire({
                title: "¿Deseas confirmar la compra?",
                text: "Se procesará tu pedido de la Escaloneta",
                icon: "question",
                showCancelButton: true,
                confirmButtonText: "Sí, comprar",
                cancelButtonText: "Cancelar"
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({
                        title: "¡Compra exitosa!",
                        text: "Gracias por tu compra.",
                        icon: "success"
                    }).then(() => {
                        vaciarCarrito();
                        window.location.href = "index.html";
                    });
                }
            });
        }

        // Inicializar al cargar la página
        document.addEventListener("DOMContentLoaded", () => {
            recorrerCarrito();
            if (typeof recorrerBotonCarrito === 'function') recorrerBotonCarrito();
        });
    </script>
</body>
</html>

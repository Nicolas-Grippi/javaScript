<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto | Escaloneta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-5">
        <div class="container">
            <a class="navbar-brand" href="index.html"><img src="./images/logoafa.png" width="50"></a>
            <div id="totalCarrito" class="badge bg-danger">0</div>
        </div>
    </nav>

    <div class="container bg-white p-5 rounded shadow-sm">
        <div id="detalleProducto" class="row align-items-center">
            </div>
    </div>

    <script src="js/funciones.js"></script>
    <script>
        // Lógica específica para esta página
        const producto = cargarProducto(); // Esta función ya la tenés en funciones.js
        const contenedor = document.getElementById("detalleProducto");

        if (producto) {
            contenedor.innerHTML = `
                <div class="col-md-6 text-center">
                    <img src="images/${producto.imagen}" class="img-fluid rounded" alt="${producto.nombre}">
                </div>
                <div class="col-md-6">
                    <h1 class="display-5 fw-bold">${producto.nombre}</h1>
                    <p class="fs-3 text-primary fw-bold">$${producto.precio.toLocaleString('es-AR')}</p>
                    <p class="text-muted">Camiseta oficial de alta calidad, edición especial campeones del mundo. Disponible en todos los talles.</p>
                    <button class="btn btn-dark btn-lg w-100 mt-4" onclick="agregarProducto(${producto.id})">
                        <i class="bi bi-cart-plus me-2"></i>Añadir al carrito
                    </button>
                    <a href="index.html" class="btn btn-outline-secondary w-100 mt-2">Volver a la tienda</a>
                </div>
            `;
        }
        recorrerBotonCarrito();
    </script>
</body>
</html>
